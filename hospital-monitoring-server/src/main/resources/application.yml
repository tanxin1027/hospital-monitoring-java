server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hospital_monitoring?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: monitor
    password: monitor123
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  sql:
    init:
      schema-locations: classpath:schema.sql
      mode: always

monitoring:
  server:
    enabled: true
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: hospital-monitoring-system
  
  # MySQL Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/hospital_monitoring?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}
    timeout: 5000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  
  # Logging
  logging:
    level:
      com.hospital.monitoring: INFO
      org.springframework.web: INFO

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:hospital-monitoring-secret-key-2026}
  expiration: 2592000000 # 30 days in milliseconds

# Monitoring Configuration
monitoring:
  agent:
    heartbeat-interval: 60000 # 1 minute
    token-expiration: 2592000000 # 30 days
  metrics:
    retention-days: 30

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
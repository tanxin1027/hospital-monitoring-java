server:
  port: 8081

monitoring:
  agent:
    enabled: true
    collection-interval: 60 # seconds
    reporting-url: http://localhost:8080/api/metrics
    
system:
  metrics:
    cpu: true
    memory: true
    disk: true
    network: true
    load: true

tomcat:
  metrics:
    enabled: true
    jmx-host: localhost
    jmx-port: 9999

mysql:
  metrics:
    enabled: true
    host: localhost
    port: 3306
    username: monitor
    password: monitor123
    database: information_schema
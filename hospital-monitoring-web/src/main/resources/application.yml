server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hospital_monitoring?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: monitor
    password: monitor123
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  thymeleaf:
    enabled: true
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  
  security:
    user:
      name: admin
      password: admin123

monitoring:
  web:
    enabled: true